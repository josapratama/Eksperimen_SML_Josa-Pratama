name: Automated Preprocessing - Heart Disease

on:
  push:
    branches:
      - main
    paths:
      - 'preprocessing/**'
      - 'heart_disease_raw.csv'
  workflow_dispatch:

jobs:
  preprocessing:
    runs-on: ubuntu-latest

    steps:
      - name: Run actions/checkout@v3
        uses: actions/checkout@v3

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.7"

      - name: Check Env
        run: |
          python --version
          pip --version
          echo "Files available:"
          ls -la

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas==2.2.2 numpy==1.26.4 scikit-learn==1.5.2

      - name: Run automate preprocessing
        run: |
          cd preprocessing
          python automate_Josa-Pratama.py

      - name: Verify output
        run: |
          echo "=== Hasil Preprocessing ==="
          ls -la preprocessing/heart_disease_preprocessing/
          python -c "
          import pandas as pd
          train = pd.read_csv('preprocessing/heart_disease_preprocessing/train.csv')
          test = pd.read_csv('preprocessing/heart_disease_preprocessing/test.csv')
          print(f'Train shape: {train.shape}')
          print(f'Test shape: {test.shape}')
          print(f'Columns: {list(train.columns[:5])}...')
          "

      - name: Commit preprocessed dataset to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add preprocessing/heart_disease_preprocessing/
          git diff --staged --quiet || git commit -m "ci: update preprocessed dataset [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
